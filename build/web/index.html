<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Three little adventures: hop across the lagoon, explore Frog River, and test your luck in Lucky Lagoon.">
<title>Lily Pad Escape</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#126c78;font-family:system-ui,sans-serif}#canvas{display:block;width:100%;height:100%;outline:none}#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#f5f2dc;color:#183f3b;transition:opacity .25s}h1{margin:20px 0 8px;font-size:38px;letter-spacing:-1.5px}p{color:#5b766a;font-size:16px}progress{width:240px;height:6px;border:none;accent-color:#7ca945;margin:20px auto}progress::-webkit-progress-bar{background:#dfe4cd;border-radius:4px}progress::-webkit-progress-value{background:#7ca945;border-radius:4px}.leaf{margin:auto;width:64px;height:64px;background:#a5ce46;border-radius:50%;clip-path:polygon(0 0,100% 0,100% 42%,50% 50%,100% 64%,100% 100%,0 100%);animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px) rotate(-8deg)}}#error{max-width:460px;line-height:1.6;padding:0 24px}noscript{position:absolute;inset:30%;color:white}#loading.hidden{opacity:0;pointer-events:none}
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="Lily Pad Escape game. Use WASD or arrow keys to move, Space to jump, mouse to look, left click or F to swing the bat in Level 2, Escape to pause, R to restart."></canvas>
<noscript>Enable JavaScript to play Lily Pad Escape.</noscript>
<div id="loading" role="status"><div class="leaf"></div><h1>Lily Pad Escape</h1><p id="loading-text">A little lagoon is coming to life…</p><progress id="progress"></progress><p id="error" hidden></p></div>
<script src="index.js"></script>
<script>
const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":9221844,"index.wasm":37686550},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
const loading = document.getElementById('loading');
const progress = document.getElementById('progress');
function fail(error) { console.error(error); document.getElementById('loading-text').textContent='The lagoon couldn’t load.'; progress.hidden=true; const message=document.getElementById('error'); message.hidden=false; message.textContent=String(error)+' Try a recent desktop Chrome or Firefox with WebGL 2 enabled, then reload.'; }
const missing = Engine.getMissingFeatures({threads: false});
if(missing.length) fail('Missing browser support: '+missing.join(', '));
else engine.startGame({onProgress(current,total){if(total>0){progress.max=total;progress.value=current;}}}).then(()=>{loading.classList.add('hidden');setTimeout(()=>loading.remove(),300);}).catch(fail);
</script>
</body>
</html>
